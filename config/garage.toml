# Garage for the `storage` profile. `api` writes both secret files before this starts.
metadata_dir = "/var/lib/garage/meta"
data_dir = "/var/lib/garage/data"
db_engine = "sqlite"
replication_factor = 1
rpc_bind_addr = "[::]:3901"
rpc_secret_file = "/secrets/rpc_secret"

[s3_api]
s3_region = "us-east-1"   # Anything else and presigned URLs from standard clients fail
api_bind_addr = "[::]:3900"

[admin]
api_bind_addr = "[::]:3903"
admin_token_file = "/secrets/admin_token"
