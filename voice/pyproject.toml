[project]
name = "canopy-voice"
version = "1.0.0"
description = "Voice front end for Canopy tool groups, built on Pipecat: one group per speaker, confirmation enforced in code."
license = "MIT"
requires-python = ">=3.12"
dependencies = [
    "pipecat-ai[anthropic,mcp]>=1.16,<2",
    "wyoming>=1.5",
    "httpx>=0.27",
    "pyyaml>=6.0",
    "starlette>=0.40",
    "uvicorn>=0.30",
    "python-multipart>=0.0.9",
]

[project.optional-dependencies]
openai = ["pipecat-ai[openai]>=1.16,<2"]

[project.scripts]
canopy-voice = "canopy_voice.cli:main"

[dependency-groups]
dev = ["pytest>=8", "pytest-asyncio>=0.23"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/canopy_voice"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
