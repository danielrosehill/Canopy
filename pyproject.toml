[project]
name = "canopy"
version = "0.1.0"
description = "Self-hosted progressive discovery for AI agents, across skills and plugins as well as tools."
readme = "README.md"
license = "MIT"
requires-python = ">=3.12"
dependencies = [
    "httpx>=0.27",
    "mcp>=1.2,<2",
    "numpy>=1.26",
    "pgvector>=0.4",
    "psycopg[binary,pool]>=3.2",
    "pyyaml>=6.0",
    "starlette>=0.40",
    "uvicorn>=0.30",
]

[dependency-groups]
dev = ["pytest>=8"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/canopy"]

[tool.pytest.ini_options]
testpaths = ["tests"]
