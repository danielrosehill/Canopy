# Canopy. `clients/canopy init` then `clients/canopy up` start the core; other pieces are profiles.
# Yours: CANOPY_AGENT_DATA. Canopy's: CANOPY_DATA. Settings: see .env.example.
name: canopy

x-canopy: &canopy
  image: ghcr.io/danielrosehill/canopy:${CANOPY_TAG:-main}
  build: .
  restart: unless-stopped
  networks: [canopy]

x-mcp-health: &mcp-health
  test: ["CMD", "python", "-c", "import socket; socket.create_connection(('127.0.0.1', 3000), 2)"]
  interval: 3s
  timeout: 3s
  retries: 20
  start_period: 2s

x-canopy-db: &canopy-db
  CANOPY_DATABASE_URL: postgres://canopy:${CANOPY_DB_PASSWORD:-canopy}@db:5432/canopy

x-canopy-env: &canopy-env
  SERVER_MODE: ${SERVER_MODE:-enterprise}
  CORE_GROUP: ${CORE_GROUP:-core}
  TOOLS_GROUP: ${TOOLS_GROUP:-}
  CANOPY_CLIENT_NAME: ${CANOPY_CLIENT_NAME:-canopy}

services:
  db:
    image: pgvector/pgvector:0.8.1-pg17
    environment:
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-canopy}   # no published port
      GATEWAY_DB_PASSWORD: ${GATEWAY_DB_PASSWORD:-canopy}
      CANOPY_DB_PASSWORD: ${CANOPY_DB_PASSWORD:-canopy}
    volumes:
      - ${CANOPY_DATA:-${HOME}/canopy/data}/postgres:/var/lib/postgresql/data
      - ./scripts/db-init.sh:/docker-entrypoint-initdb.d/10-canopy.sh:ro
    healthcheck:
      # Over TCP, and into `canopy`: during first-start setup only the socket answers.
      test: ["CMD-SHELL", "pg_isready -h 127.0.0.1 -U postgres -d canopy"]
      interval: 5s
      timeout: 5s
      retries: 12
    restart: unless-stopped
    networks: [canopy]

  gateway:
    image: ghcr.io/mcpjungle/mcpjungle:${MCPJUNGLE_TAG:-0.4.7-stdio}
    environment:
      DATABASE_URL: postgres://mcpjungle:${GATEWAY_DB_PASSWORD:-canopy}@db:5432/mcpjungle
      SERVER_MODE: ${SERVER_MODE:-enterprise}
      MCP_SERVER_INIT_REQ_TIMEOUT_SEC: ${MCP_SERVER_INIT_REQ_TIMEOUT_SEC:-20}
    ports:
      - "${CANOPY_BIND:-127.0.0.1}:${CANOPY_PORT:-8080}:8080"
    depends_on:
      db:
        condition: service_healthy
    restart: unless-stopped
    networks: [canopy]

  catalogue:
    <<: *canopy
    command: ["python", "-m", "canopy.catalogue"]
    healthcheck: *mcp-health
    environment:
      <<: [*canopy-env, *canopy-db]
      GITHUB_TOKEN: ${GITHUB_TOKEN:-}
      CANOPY_API_TOKEN: ${CANOPY_API_TOKEN:-}
      EMBED_PROVIDER: ${EMBED_PROVIDER:-}
      EMBED_MODEL: ${EMBED_MODEL:-bge-m3}
      EMBED_ON_SYNC: ${EMBED_ON_SYNC:-false}
      RERANK_MODEL: ${RERANK_MODEL:-}
      RERANK_API_KEY: ${RERANK_API_KEY:-}
      RERANK_TIMEOUT_SEC: ${RERANK_TIMEOUT_SEC:-2}
    depends_on:
      db:
        condition: service_healthy
    volumes:
      - ${CANOPY_DATA:-${HOME}/canopy/data}/catalogue:/data
      - ${CANOPY_DATA:-${HOME}/canopy/data}/api:/api:ro
      - ${CANOPY_DATA:-${HOME}/canopy/data}/tokens:/tokens:ro
      - ${CANOPY_AGENT_DATA:-${HOME}/canopy/agent-data}/config:/config:ro

  toolbox:
    <<: *canopy
    command: ["python", "-m", "canopy.toolbox"]
    healthcheck: *mcp-health
    environment:
      <<: *canopy-env
    volumes:
      - ${CANOPY_DATA:-${HOME}/canopy/data}/tokens:/tokens:ro

  # The control API. It alone holds the gateway's admin token, and expands ${VAR} in servers.json.
  api:
    <<: *canopy
    command: ["python", "-m", "canopy.api"]
    healthcheck:
      <<: *mcp-health
      test: ["CMD", "python", "-c", "import socket; socket.create_connection(('127.0.0.1', 8090), 2)"]
    environment:
      <<: [*canopy-env, *canopy-db]
      CANOPY_API_TOKEN: ${CANOPY_API_TOKEN:-}
      EMBED_PROVIDER: ${EMBED_PROVIDER:-}
      EMBED_FALLBACK: ${EMBED_FALLBACK:-}
      EMBED_ON_SYNC: ${EMBED_ON_SYNC:-false}
      OPENROUTER_API_KEY: ${OPENROUTER_API_KEY:-}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-canopy}   # dumps and restores both databases
      CANOPY_STORAGE_PUBLIC_URL: ${CANOPY_STORAGE_PUBLIC_URL:-http://127.0.0.1:${CANOPY_STORAGE_PORT:-3900}}
      CANOPY_STORAGE_CAPACITY_GB: ${CANOPY_STORAGE_CAPACITY_GB:-10}
      CANOPY_STAGE_MAX_MB: ${CANOPY_STAGE_MAX_MB:-256}
    env_file:
      - path: ${CANOPY_AGENT_DATA:-${HOME}/canopy/agent-data}/secrets.env
        required: false
    ports:
      - "${CANOPY_API_BIND:-127.0.0.1}:${CANOPY_API_PORT:-8090}:8090"
    volumes:
      - ${CANOPY_DATA:-${HOME}/canopy/data}/api:/api
      - ${CANOPY_DATA:-${HOME}/canopy/data}/admin:/admin
      - ${CANOPY_DATA:-${HOME}/canopy/data}/tokens:/tokens
      - ${CANOPY_AGENT_DATA:-${HOME}/canopy/agent-data}/config:/config
      - ${CANOPY_AGENT_DATA:-${HOME}/canopy/agent-data}:/agent-data
      - ${CANOPY_DATA:-${HOME}/canopy/data}/backups:/backups
      - ${CANOPY_DATA:-${HOME}/canopy/data}/storage-secrets:/storage-secrets
    depends_on:
      gateway:
        condition: service_started
      catalogue:
        condition: service_healthy
      toolbox:
        condition: service_healthy

  # One-shot. It runs on every `up`, and the API changes only what differs from the config.
  seed:
    <<: *canopy
    command: ["python", "-m", "canopy.seed"]
    restart: "no"
    environment:
      CANOPY_API_TOKEN: ${CANOPY_API_TOKEN:-}
    volumes:
      - ${CANOPY_DATA:-${HOME}/canopy/data}/api:/api:ro
    depends_on:
      api:
        condition: service_healthy

  # The CLIs that skills use. Run from the host with `canopy run`.
  cli:
    image: ghcr.io/danielrosehill/canopy:cli-${CANOPY_TAG:-main}
    build:
      context: .
      dockerfile: cli/Dockerfile
    init: true
    user: "${CANOPY_UID:-1000}:${CANOPY_GID:-1000}"
    env_file:
      - path: ${CANOPY_AGENT_DATA:-${HOME}/canopy/agent-data}/secrets.env
        required: false
    volumes:
      - ${CANOPY_AGENT_DATA:-${HOME}/canopy/agent-data}:/agent-data
      - ${CANOPY_DATA:-${HOME}/canopy/data}/api:/api:ro
    restart: unless-stopped
    networks: [canopy]

  ui:
    <<: *canopy
    profiles: [ui]
    command: ["python", "-m", "canopy.ui"]
    environment:
      <<: *canopy-env
      UI_ALLOWED_HOSTS: ${UI_ALLOWED_HOSTS:-localhost,127.0.0.1}
    ports:
      - "${CANOPY_BIND:-127.0.0.1}:${CANOPY_UI_PORT:-8081}:8081"
    volumes:
      - ${CANOPY_DATA:-${HOME}/canopy/data}/tokens:/tokens:ro

  # S3-compatible staging. Unmodified, and it has no shell, so `api` bootstraps it on first use.
  storage:
    image: dxflrs/garage:v2.5.0
    profiles: [storage]
    ports:
      - "${CANOPY_STORAGE_BIND:-127.0.0.1}:${CANOPY_STORAGE_PORT:-3900}:3900"
    volumes:
      - ./config/garage.toml:/etc/garage.toml:ro
      - ${CANOPY_DATA:-${HOME}/canopy/data}/storage:/var/lib/garage
      - ${CANOPY_DATA:-${HOME}/canopy/data}/storage-secrets:/secrets:ro
    depends_on:
      api:
        condition: service_healthy
    restart: unless-stopped
    networks: [canopy]

  ollama:
    image: ollama/ollama:0.12.6
    profiles: [search]
    volumes:
      - ${CANOPY_DATA:-${HOME}/canopy/data}/ollama:/root/.ollama
    restart: unless-stopped
    networks: [canopy]

  ollama-pull:
    image: ollama/ollama:0.12.6
    profiles: [search]
    environment:
      OLLAMA_HOST: http://ollama:11434
    entrypoint: ["sh", "-c", "sleep 5 && ollama pull ${EMBED_MODEL:-bge-m3}"]
    depends_on:
      - ollama
    networks: [canopy]

  tunnel:
    image: cloudflare/cloudflared:2025.10.0
    profiles: [tunnel]
    command: ["tunnel", "--no-autoupdate", "run"]
    environment:
      TUNNEL_TOKEN: ${TUNNEL_TOKEN:-}
    restart: unless-stopped
    networks: [canopy]

  tailnet:
    image: tailscale/tailscale:v1.88.3
    profiles: [tailnet]
    hostname: ${TS_HOSTNAME:-canopy}
    environment:
      TS_AUTHKEY: ${TS_AUTHKEY:-}
      TS_STATE_DIR: /var/lib/tailscale
      TS_USERSPACE: "true"
      TS_SERVE_CONFIG: /serve/tailnet-serve.json
    volumes:
      - ${CANOPY_DATA:-${HOME}/canopy/data}/tailnet:/var/lib/tailscale
      - ./config/tailnet-serve.json:/serve/tailnet-serve.json:ro
    restart: unless-stopped
    networks: [canopy]

networks:
  canopy:
