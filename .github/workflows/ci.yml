name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: astral-sh/setup-uv@v6
      - run: uv sync --frozen
      - run: uv run pytest
      - run: uv sync --frozen && uv run pytest
        working-directory: voice
      - run: docker compose config --quiet
      - run: docker compose -f compose.yaml -f examples/overlay/compose.override.yaml config --quiet
      - run: docker compose -f compose.yaml -f compose.overlay.yaml config --quiet

  contract:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        mode: [enterprise, development]
    steps:
      - uses: actions/checkout@v5
      - uses: astral-sh/setup-uv@v6
      - run: uv sync --frozen
      - run: tests/contract/run.sh
        env:
          SERVER_MODE: ${{ matrix.mode }}

  backup:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - run: tests/contract/backup.sh

  storage:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - run: tests/contract/storage.sh

  secrets:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - run: |
          docker run --rm -v "$PWD:/repo" ghcr.io/gitleaks/gitleaks:v8.30.1 \
            git /repo --redact --no-banner

  image:
    needs: [test, contract, backup, storage, secrets]
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v5
      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/login-action@v3
        with:
          username: danielrosehill
          password: ${{ secrets.DOCKERHUB_TOKEN }}
      - uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          tags: |
            danielrosehill/canopy:main
            danielrosehill/canopy:${{ github.sha }}
            ghcr.io/danielrosehill/canopy:main
            ghcr.io/danielrosehill/canopy:${{ github.sha }}
      - uses: docker/build-push-action@v6
        with:
          context: .
          file: cli/Dockerfile
          platforms: linux/amd64,linux/arm64
          push: true
          tags: |
            danielrosehill/canopy:cli-main
            danielrosehill/canopy:cli-${{ github.sha }}
            ghcr.io/danielrosehill/canopy:cli-main
            ghcr.io/danielrosehill/canopy:cli-${{ github.sha }}
      - uses: docker/build-push-action@v6
        with:
          context: .
          file: voice/Dockerfile
          platforms: linux/amd64,linux/arm64
          push: true
          tags: |
            danielrosehill/canopy:voice-main
            danielrosehill/canopy:voice-${{ github.sha }}
            ghcr.io/danielrosehill/canopy:voice-main
            ghcr.io/danielrosehill/canopy:voice-${{ github.sha }}

  # Every push to main that passes and changes what ships becomes the next release, v<major>.<NN>. A push
  # that only touches docs, tests or plugins makes none: the plugins are served from main, not from a release.
  tag:
    needs: image
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    concurrency: { group: release, cancel-in-progress: false }
    permissions:
      contents: write
    outputs:
      tag: ${{ steps.next.outputs.tag }}
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - id: next
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          git fetch -q --tags --force
          last=$(git tag --list 'v[0-9]*.[0-9]*' --sort=-v:refname | head -1)
          if [ -n "$last" ] && git merge-base --is-ancestor "$GITHUB_SHA" "$last"; then
            echo "already released in $last"; exit 0
          fi
          if [ -n "$last" ] && git diff --quiet "$last" "$GITHUB_SHA" -- \
              src clients cli voice/src voice/pyproject.toml voice/uv.lock voice/Dockerfile config Dockerfile compose.yaml compose.overlay.yaml pyproject.toml uv.lock scripts/db-init.sh; then
            echo "nothing that ships changed since $last"; exit 0
          fi
          major=${last%%.*}; major=${major:-v1}
          n=$(( ${last:+10#${last#*.}} + 1 ))
          [ "$n" -le 99 ] || { echo "::error::$major.99 reached: medium tier, the next release is a new major, cut by hand"; exit 1; }
          tag=$(printf '%s.%02d' "$major" "$n")
          git config user.name github-actions
          git config user.email github-actions@users.noreply.github.com
          git tag -a "$tag" -m "$tag" "$GITHUB_SHA"
          git push -q origin "$tag"
          gh release create "$tag" --verify-tag --title "$tag" --generate-notes --notes-start-tag "$last"
          echo "tag=$tag" >> "$GITHUB_OUTPUT"

  release:
    needs: tag
    if: needs.tag.outputs.tag != ''
    permissions:
      contents: read
      packages: write
    uses: ./.github/workflows/release.yml
    with:
      tag: ${{ needs.tag.outputs.tag }}
      sha: ${{ github.sha }}
    secrets: inherit
