name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: astral-sh/setup-uv@v6
      - run: uv sync --frozen
      - run: uv run pytest
      - run: docker compose config --quiet

  contract:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        mode: [enterprise, development]
    steps:
      - uses: actions/checkout@v5
      - uses: astral-sh/setup-uv@v6
      - run: uv sync --frozen
      - run: tests/contract/run.sh
        env:
          SERVER_MODE: ${{ matrix.mode }}

  backup:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - run: tests/contract/backup.sh

  storage:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - run: tests/contract/storage.sh

  secrets:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - run: |
          docker run --rm -v "$PWD:/repo" ghcr.io/gitleaks/gitleaks:v8.30.1 \
            git /repo --redact --no-banner

  image:
    needs: [test, contract, backup, secrets]
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v5
      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          tags: |
            ghcr.io/danielrosehill/canopy:main
            ghcr.io/danielrosehill/canopy:${{ github.sha }}
      - uses: docker/build-push-action@v6
        with:
          context: .
          file: cli/Dockerfile
          platforms: linux/amd64,linux/arm64
          push: true
          tags: |
            ghcr.io/danielrosehill/canopy:cli-main
            ghcr.io/danielrosehill/canopy:cli-${{ github.sha }}
