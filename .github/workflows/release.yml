name: Release

# Pushing a tag such as v1.00 gives that commit's images two more names, v1.00 and v1, on Docker Hub
# and on the GHCR mirror. Nothing is rebuilt, so a release is the exact image CI tested. Tag a commit
# only after CI has passed on it.
on:
  push:
    tags: ["v[0-9]*.[0-9]*"]

jobs:
  images:
    runs-on: ubuntu-latest
    permissions:
      packages: write
    steps:
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/login-action@v3
        with:
          username: danielrosehill
          password: ${{ secrets.DOCKERHUB_TOKEN }}
      - name: Name the tested images
        run: |
          hub=danielrosehill/canopy
          ghcr=ghcr.io/danielrosehill/canopy
          version="$GITHUB_REF_NAME"
          major="${version%%.*}"
          for prefix in "" "cli-"; do
            docker buildx imagetools create \
              -t "$hub:$prefix$version" -t "$hub:$prefix$major" \
              -t "$ghcr:$prefix$version" -t "$ghcr:$prefix$major" \
              "$hub:$prefix$GITHUB_SHA"
          done
